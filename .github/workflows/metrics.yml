name: Metrics
on:
  # Updates the metrics every night at midnight
  schedule: [{cron: "0 0 * * *"}]
  # Allows you to run it manually from the Actions tab
  workflow_dispatch:
  # Updates when you push changes to the main branch
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # This token is provided automatically by GitHub
          token: ${{ secrets.GITHUB_TOKEN }}
          
          # Options
          user: shashi8work-web
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          
          # Isometric 3D Calendar (The green blocks)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
         # Coding Habits (The bar charts)
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 14
          plugin_habits_facts: no      # <--- CHANGE THIS TO "no"
          plugin_habits_from: 200
          
          # Languages (The progress bar)
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
